name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v7

    - name: Setup Graphviz
      uses: ts-graphviz/setup-graphviz@v2

    - name: Install uv and Python
      uses: astral-sh/setup-uv@v10.4.0
      with:
        python-version: "3.13"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked

    - name: Build Sphinx docs
      run: uv run sphinx-build -b html docs gh-pages

    - name: Run tests and generate coverage report
      run: |
        uv run coverage run -m pytest
        echo "COVERAGE=$(uv run coverage report --precision 2 | grep TOTAL | tr -s ' ' | cut -f 4 -d " ")" >> $GITHUB_ENV
        uv run coverage html --directory gh-pages/coverage

    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: 'gh-pages'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5

    - name: Create Coverage Badge
      uses: schneegans/dynamic-badges-action@v1.9.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: f99aea7ea203d16edd063a8dd5ed395f
        filename: coverage-badge.json
        label: coverage
        message: ${{ env.COVERAGE }}
        color: green
